[build]
  publish = "."

# Le site officiel est https://navia-production.com
# L'ancien sous-domaine Netlify redirige en 301 pour éviter tout contenu dupliqué.
[[redirects]]
  from = "https://navia-production.netlify.app/*"
  to = "https://navia-production.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
